name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: black --check .
      - run: mypy control_probe
      - run: pytest --cov=control_probe --cov-report=term-missing
      - run: python -m build
      - run: control-probe run --spec specs/reserve_at_par.yaml --adapter fixture --fixture-file tests/fixtures/reserve_pass.json
      - run: control-probe run --spec specs/nav_integrity.yaml --adapter fixture --fixture-file tests/fixtures/nav_stale.json || true
      - run: control-probe validate --spec specs/redemption_at_par.yaml
      - run: twine check dist/*
      - run: docker build -t control-probe:ci .
      - run: docker run --rm control-probe:ci validate --spec specs/reserve_at_par.yaml
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npm run smoke
        working-directory: web
