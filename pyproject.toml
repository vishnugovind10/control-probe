[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "control-probe"
version = "0.1.0"
description = "Verify digital asset control specifications against implementations"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
keywords = [
    "compliance-automation",
    "control-testing",
    "digital-assets",
    "evidence-generation",
    "evm",
    "institutional-infrastructure",
    "reserve-assurance",
    "risk-controls",
    "stablecoins",
    "tokenization",
    "web3",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Framework :: Pydantic",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial",
    "Topic :: Security",
    "Typing :: Typed",
]
dependencies = [
    "typer>=0.12",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "web3>=6.0",
    "rich>=14.3.3,<15",
]

[project.optional-dependencies]
dev = [
    "black",
    "build",
    "mypy",
    "pytest>=8.0",
    "pytest-cov",
    "ruff",
    "twine>=7.0",
]

[project.scripts]
control-probe = "control_probe.cli:app"
control-probe-quality-gate = "control_probe.quality_gate:main"

[project.urls]
Repository = "https://github.com/control-probe/control-probe"
Issues = "https://github.com/control-probe/control-probe/issues"

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true

[tool.pytest.ini_options]
addopts = "--cov=control_probe --cov-report=term-missing --cov-fail-under=90"
testpaths = ["tests"]
