[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "control-probe"
version = "0.1.0"
description = "Verify digital asset control specifications against implementations"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "web3>=6.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "black",
    "mypy",
    "pytest>=8.0",
    "pytest-cov",
    "ruff",
]

[project.scripts]
control-probe = "control_probe.cli:app"

[project.urls]
Repository = "https://github.com/control-probe/control-probe"
Issues = "https://github.com/control-probe/control-probe/issues"

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true

[tool.pytest.ini_options]
addopts = "--cov=control_probe --cov-report=term-missing --cov-fail-under=90"
testpaths = ["tests"]
